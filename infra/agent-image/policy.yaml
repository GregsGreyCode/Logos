# OpenShell 0.1.8 sandbox policy for Logos v2 agents (S2.3 filesystem; S2.4 adds network rules).
version: 1

filesystem_policy:
  include_workdir: true            # /sandbox, the agent's scratch workspace
  read_only:
    - /bin
    - /usr                         # includes /usr/local/bin/python3 used by the hermes venv
    - /lib
    - /etc
    - /opt/hermes                  # upstream hermes install (sealed venv, scripts)
    - /opt/logos                   # plugins baked into the image, copied into the home at start
    - /proc
    - /dev/urandom
    - /var/log
  read_write:
    - /opt/data                    # hermes home volume, with the brain volume mounted at /opt/data/brain
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

# S2.4: deny by default. Only the hermes Python interpreter may connect, and only to these.
# The interpreter's real path (symlinks are not matched): /opt/hermes/tools/python-<ver>/bin/python3.<n>
network_policies:
  lm_studio:                       # local models on the LAN PC (private address, so pinned).
                                   # 192.0.2.117 is a placeholder: logos-agent rewrites this rule
                                   # from the agent's model.base_url (set in agents/<name>.local.yaml).
    endpoints:
      - host: 192.0.2.117
        port: 1234
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips: [192.0.2.117/32]
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  model_health:                    # story D2: "is LM Studio back?", asked of the model guard. One
                                   # request only; removed for agents not behind the model gateway.
    endpoints:
      - host: 192.0.2.1
        port: 8094
        protocol: rest
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        rules:
          - allow: {method: GET, path: /guard/health}
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  noticeboard:                     # the only channel to other agents (gateway/noticeboard.py).
                                   # Inspected as MCP: only the handshake, the tool list and the
                                   # two tools get through. Placeholder address: logos-agent fills
                                   # in the real one, and removes both noticeboard rules for
                                   # agents with no `noticeboard: true`.
    endpoints:
      - host: 192.0.2.1
        port: 8090
        protocol: mcp
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        mcp:
          versions: ["2025-03-26", "2025-06-18", "2025-11-25"]
        rules:
          - allow: {method: initialize}
          - allow: {method: notifications/initialized}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow:
              method: tools/call
              tool:
                any: [send_message, read_messages]
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  web:                             # web search through the Logos web reader (gateway/web_service.py),
                                   # which filters what leaves the house. Inspected as MCP: only the
                                   # handshake, the tool list, search_web, add_private_name,
                                   # file_request, recent_changes and the read-only docs tools get
                                   # through (the household agent: all but search_web and
                                   # add_private_name).
                                   # logos-agent fills in the address, or removes this rule.
    endpoints:
      - host: 192.0.2.1
        port: 8096
        protocol: mcp
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        mcp:
          versions: ["2025-03-26", "2025-06-18", "2025-11-25"]
        rules:
          - allow: {method: initialize}
          - allow: {method: notifications/initialized}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow:
              method: tools/call
              tool:
                any: [search_web, add_private_name, file_request, recent_changes, search_docs, read_doc,
                      list_docs]
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  calendar:                        # the household's calendars, through the Logos calendar service
                                   # (gateway/calendar_service.py). Inspected as MCP: only the
                                   # handshake, the tool list and its six tools get through.
                                   # logos-agent fills in the address, or removes this rule.
    endpoints:
      - host: 192.0.2.1
        port: 8095
        protocol: mcp
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        mcp:
          versions: ["2025-03-26", "2025-06-18", "2025-11-25"]
        rules:
          - allow: {method: initialize}
          - allow: {method: notifications/initialized}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow:
              method: tools/call
              tool:
                any: [list_calendars, list_events, add_event, update_event, cancel_event, find_free_time]
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  house:                           # the lights, through the Logos house service (gateway/house_service.py).
                                   # Household agent only. Inspected as MCP: the handshake, the tool
                                   # list and the tools for its domains. logos-agent fills in the
                                   # address and the tools, or removes this rule.
    endpoints:
      - host: 192.0.2.1
        port: 8098
        protocol: mcp
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        mcp:
          versions: ["2025-03-26", "2025-06-18", "2025-11-25"]
        rules:
          - allow: {method: initialize}
          - allow: {method: notifications/initialized}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow:
              method: tools/call
              tool:
                any: [list_lights, set_lights, list_scenes, activate_scene,
                      list_items, add_items, change_item, tick_items, remove_items]
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  weather:                         # today's forecast for the morning briefing, from the web reader
                                   # (which asks Open-Meteo). One request only. Removed for agents
                                   # without `web: {enabled: true}`.
    endpoints:
      - host: 192.0.2.1
        port: 8097
        protocol: rest
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        rules:
          - allow: {method: GET, path: /weather}
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  changes:                         # the daily changes (story DC1): recent merged PRs and commits of
                                   # Logos and homelab-infra, from the web reader (which asks GitHub).
                                   # Only GET /changes/<repo>/<days>; no search. Removed for agents
                                   # without `changes: {enabled: true}`.
    endpoints:
      - host: 192.0.2.1
        port: 8097
        protocol: rest
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        rules:
          - allow: {method: GET, path: "/changes/**"}
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  noticeboard_poll:                # the sandbox's own scripts ask "anything new?" and "anything urgent?"
    endpoints:
      - host: 192.0.2.1
        port: 8092
        protocol: rest
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        rules:
          - allow: {method: GET, path: /pending}
          - allow: {method: GET, path: /urgent}
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  voice:                           # voice notes become text at the shared voice service (docs/voice.md).
                                   # One request only: send a recording, get its words back.
    endpoints:
      - host: 192.0.2.1
        port: 8093
        protocol: rest
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        rules:
          - allow: {method: POST, path: /v1/audio/transcriptions}
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  advisor:                         # questions to Claude, each approved by the person first, through
                                   # the Logos advisor (gateway/advisor_service.py). Inspected as MCP:
                                   # the handshake, the tool list and the three advisor tools.
                                   # logos-agent fills in the address, or removes this rule (household).
    endpoints:
      - host: 192.0.2.1
        port: 8100
        protocol: mcp
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        mcp:
          versions: ["2025-03-26", "2025-06-18", "2025-11-25"]
        rules:
          - allow: {method: initialize}
          - allow: {method: notifications/initialized}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow:
              method: tools/call
              tool:
                any: [ask_advisor, advisor_answer, advisor_budget, request_more_budget]
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  mail:                            # the person's own email, through the Logos mail service
                                   # (gateway/mail_service.py). Inspected as MCP: the handshake, the
                                   # tool list and the read tools. logos-agent fills in the address,
                                   # or removes this rule for an agent without mail.
    endpoints:
      - host: 192.0.2.1
        port: 8099
        protocol: mcp
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        mcp:
          versions: ["2025-03-26", "2025-06-18", "2025-11-25"]
        rules:
          - allow: {method: initialize}
          - allow: {method: notifications/initialized}
          - allow: {method: ping}
          - allow: {method: tools/list}
          - allow:
              method: tools/call
              tool:
                any: [mail_new, mail_needs_reply, mail_search, mail_read, mail_thread]
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  matrix:                          # the household's own Matrix server (gateway/matrix_host.py).
                                   # Placeholder address: logos-agent fills in the real one, and
                                   # removes this rule for agents without `matrix: {enabled: true}`.
    endpoints:
      - host: 192.0.2.1
        port: 6167
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips: [192.0.2.1/32]
        allow_encoded_slash: true  # Matrix IDs in paths (e.g. secret-storage key ids) carry %2F
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  alerts:                          # a reply's words for the person's phone alert (gateway/alert_text.py).
                                   # The dashboard, one path, POST only. Filled in with the Matrix rule
                                   # and removed with it.
    endpoints:
      - host: 192.0.2.1
        port: 8091
        protocol: rest
        enforcement: enforce
        allowed_ips: [192.0.2.1/32]
        rules:
          - allow: {method: POST, path: /api/v2/alert-text}
    binaries:
      - path: /opt/hermes/tools/python-*/bin/python3*

  # api.anthropic.com is NOT listed here. It comes from the provider profile in
  # infra/openshell/providers/anthropic.yaml, which also binds the API key to that host.
