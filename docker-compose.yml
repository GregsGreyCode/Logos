# Logos — simple Docker Compose deployment
#
# Agents run as OpenShell sandboxes (the only supported runtime). The
# gateway container talks to OpenShell's embedded k3s on the host, which
# in turn manages per-agent sandbox pods.
#
# Quick start:
#   cp .env.example .env   # fill in HERMES_JWT_SECRET (required)
#   docker compose up -d
#   open http://localhost:8080
#
# Optional self-hosted tool stack (Browserless + Firecrawl) — disabled by
# default. Bring them up alongside Logos with one of:
#   docker compose --profile selfhost-tools up -d   # both
#   docker compose --profile browserless up -d      # browser only
#   docker compose --profile firecrawl up -d        # search/scrape only
# Logos auto-detects the services on the compose network and the gateway's
# /tools/configure UI can flip them on without manual env-var fiddling.

services:
  logos:
    build:
      context: .
      args:
        BUILD_SHA: unknown
    image: logos:local
    restart: unless-stopped
    ports:
      - "${LOGOS_PORT:-8080}:8080"
    environment:
      # ── Required ────────────────────────────────────────────────────────────
      # Generate with: openssl rand -hex 32
      LOGOS_JWT_SECRET: "${LOGOS_JWT_SECRET:-${HERMES_JWT_SECRET:-}}"
      HERMES_JWT_SECRET: "${LOGOS_JWT_SECRET:-${HERMES_JWT_SECRET:-}}"  # deprecated alias

      # ── Gateway ─────────────────────────────────────────────────────────────
      LOGOS_PORT: "8080"
      HERMES_PORT: "8080"  # deprecated alias — kept for legacy in-flight code
      LOGOS_INSTANCE_NAME: "${LOGOS_INSTANCE_NAME:-${HERMES_INSTANCE_NAME:-Hermes}}"
      HERMES_INSTANCE_NAME: "${LOGOS_INSTANCE_NAME:-${HERMES_INSTANCE_NAME:-Hermes}}"  # deprecated alias
      HERMES_LOG_LEVEL: "${HERMES_LOG_LEVEL:-info}"

      # ── Cookies ─────────────────────────────────────────────────────────────
      # Set to "true" only when running behind an HTTPS reverse proxy.
      # Leave empty (default) for plain HTTP or local access.
      HERMES_COOKIE_SECURE: "${HERMES_COOKIE_SECURE:-}"

      # ── Model / inference ───────────────────────────────────────────────────
      # These can also be set via the setup wizard on first run.
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      HERMES_MODEL: "${HERMES_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-local}"

      # ── Optional: pre-create admin account (skip setup wizard) ──────────────
      HERMES_ADMIN_EMAIL: "${HERMES_ADMIN_EMAIL:-}"
      HERMES_ADMIN_PASSWORD: "${HERMES_ADMIN_PASSWORD:-}"
      HERMES_ADMIN_NAME: "${HERMES_ADMIN_NAME:-}"

      # ── Optional integrations ───────────────────────────────────────────────
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USERS: "${TELEGRAM_ALLOWED_USERS:-}"

      # ── Self-hosted tool defaults ──────────────────────────────────────────
      # When the matching compose profile is active, Logos picks these up
      # automatically. Override in .env if you point at a different host.
      BROWSERLESS_URL: "${BROWSERLESS_URL:-}"
      BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN:-}"
      FIRECRAWL_API_URL: "${FIRECRAWL_API_URL:-}"

    volumes:
      # Persists: auth DB, memory, sessions, logs, skills, config.yaml
      - logos-data:/home/logos/.logos

    networks: [logos-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Self-hosted Browserless (CDP browser-as-a-service) ──────────────────
  # Profiles: browserless, selfhost-tools
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: logos-browserless
    profiles: [browserless, selfhost-tools]
    restart: unless-stopped
    ports:
      - "${BROWSERLESS_PORT:-3000}:3000"
    environment:
      TOKEN: "${BROWSERLESS_TOKEN:-}"
      CONCURRENT: "${BROWSERLESS_CONCURRENT:-5}"
      TIMEOUT: "${BROWSERLESS_TIMEOUT:-300000}"
    shm_size: "2gb"
    networks: [logos-net]

  # ── Self-hosted Firecrawl (web search + scrape) ─────────────────────────
  # Profiles: firecrawl, selfhost-tools
  firecrawl-redis:
    image: redis:7-alpine
    container_name: logos-firecrawl-redis
    profiles: [firecrawl, selfhost-tools]
    restart: unless-stopped
    networks: [logos-net]

  firecrawl-playwright:
    image: ghcr.io/mendableai/playwright-service:latest
    container_name: logos-firecrawl-playwright
    profiles: [firecrawl, selfhost-tools]
    restart: unless-stopped
    environment:
      PORT: "3000"
    networks: [logos-net]

  firecrawl-api:
    image: ghcr.io/mendableai/firecrawl:latest
    container_name: logos-firecrawl-api
    profiles: [firecrawl, selfhost-tools]
    restart: unless-stopped
    depends_on: [firecrawl-redis, firecrawl-playwright]
    ports:
      - "${FIRECRAWL_PORT:-3002}:3002"
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      USE_DB_AUTHENTICATION: "false"
      PORT: "3002"
      HOST: "0.0.0.0"
    networks: [logos-net]

  firecrawl-worker:
    image: ghcr.io/mendableai/firecrawl:latest
    container_name: logos-firecrawl-worker
    profiles: [firecrawl, selfhost-tools]
    restart: unless-stopped
    depends_on: [firecrawl-redis, firecrawl-api]
    command: ["pnpm", "run", "workers"]
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      USE_DB_AUTHENTICATION: "false"
    networks: [logos-net]

networks:
  logos-net:
    name: logos-net

volumes:
  logos-data:
    driver: local
