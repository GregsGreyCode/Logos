name: Tests

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_call:   # allow other workflows to call this as a gate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --ignore=tests/integration --tb=short -n auto
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  # Screen checks (tests/ui): the dashboard in a real Chrome at phone, foldable and desktop sizes against
  # a fake server. Screenshots are kept for a week as the run's "ui-screenshots".
  ui:
    # The screen checks, in three parts at once (about 6 minutes in one; Greg, 23 Nov: faster).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the browser library
        run: npm install --prefix tests/ui --no-audit --no-fund

      - name: Screen checks (every third file, from this part's place)
        run: |
          checks=$(cd tests/ui/checks && ls *.mjs | sed 's/\.mjs$//' | awk -v p=${{ matrix.part }} 'NR % 3 == p')
          CHROME="$(command -v google-chrome)" tests/ui/run.sh $checks

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.part }}
          path: tests/ui/out
          retention-days: 7
