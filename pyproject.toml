[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logos"
version = "1.0.20"
description = "Logos: a home server for a household's AI agents, each in its own sandbox, with a shared brain, noticeboard and calendar"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "gregsgreycode" }]
license = { text = "MIT" }
# The gateway only. The services it starts (calendar, voice, web reader, model gateway)
# run in their own containers with their own libraries.
dependencies = [
  "aiohttp>=3.9.0",       # the HTTP server and the gateway's own HTTP calls
  "argon2-cffi>=23.1.0",  # password hashes
  "PyJWT>=2.8",           # session tokens (HS256)
  "python-dotenv",        # ~/.logos/.env
  "pyyaml",               # agent definitions
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-xdist"]

[project.scripts]
logos = "logos_cli.main:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["logos_cli", "logos_cli.*", "gateway", "gateway.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that need a live sandbox or service",
]
addopts = "-m 'not integration' -n auto"
filterwarnings = [
    # aiohttp transports call self._loop in __del__ after the test event loop has
    # been torn down; this is a known aiohttp/asyncio cleanup race, not a real bug.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
