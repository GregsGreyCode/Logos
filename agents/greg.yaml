# Agent definition for Greg's agent (story S3.1). Create or recreate with:
#   scripts/logos-agent up greg
# Secrets are not stored here. The Matrix login is kept in the agent's private home volume.
name: greg
display_name: Greg's agent
owners: [greg]                 # web dashboard usernames that may see and talk to this agent
image: logos-agent:0.23.1
soul: souls/general/soul.md
policy: infra/agent-image/policy.yaml
providers: []                   # OpenShell providers to attach. None: everything runs on the local model,
                                # so nothing can spend money. Add `anthropic` only once a spend cap exists.
timezone: Europe/London
noticeboard: true               # may exchange messages with the other agents (docs/noticeboard.md)
voice: true                     # voice notes are turned into text by the voice service (docs/voice.md)
calendar: {enabled: true, person: greg}   # Greg's own calendar + Household (docs/calendar.md)

model:
  provider: lmstudio
  base_url: http://192.0.2.117:1234/v1   # placeholder; put the real address in agents/greg.local.yaml
  default: qwen/qwen3.6-35b-a3b   # provisional; S3.4 benchmark decides
  context_length: 65536           # must match what LM Studio loads the model with
  gateway: true                 # model calls go through the model gateway (docs/model-gateway.md)
  # No paid fallbacks: the brain stays local (gateway/model_gateway.py BRAIN_STAYS_LOCAL).
budget:
  monthly_usd: 10               # hard cap on paid model spend a month; beyond it only the local model answers

matrix:                           # the household's own Matrix server (docs/matrix.md)
  enabled: true
  e2ee: required
  allowed_users: []               # set in agents/greg.local.yaml (untracked): @name:gregandbere.com

house:                          # the lights and their scenes, through the house service (docs/house.md)
  enabled: true
  domains: [light, scene, todo]   # todo: the shared shopping and to-do lists
  exclude: []                   # entity ids it must leave alone, e.g. light.balcony_balcony

web:                              # web search through the web reader (docs/web-reader.md)
  enabled: true

consolidation:                  # nightly brain tidy-up (hermes cron job `consolidate`)
  enabled: true
  schedule: "30 2 * * *"        # in the agent's timezone; before the 03:00 fresh session
  # model / provider: omit to use the agent's main (local) model

briefing:                       # the day ahead + weather, sent in Element X (story C4, docs/briefing.md)
  enabled: true
  weekdays: "0 7 * * 1-5"       # 07:00 Monday to Friday
  weekends: "0 9 * * 0,6"       # 09:00 Saturday and Sunday

digest:                         # weekly summary of what the brain learned, sent to the Matrix home room
  enabled: true
  schedule: "0 18 * * 0"        # Sunday 18:00 in the agent's timezone

session_reset:                  # start a fresh conversation on the first message after this hour
  mode: daily
  at_hour: 3                    # in the agent's timezone
