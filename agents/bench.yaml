# Throwaway agent used by the evals; evals/agent_writes/bench.py rewrites model.default.
name: bench
display_name: Benchmark agent
image: logos-agent:0.23.1
soul: souls/general/soul.md
policy: infra/agent-image/policy.yaml
providers: []
timezone: Europe/London
model:
  provider: lmstudio
  base_url: http://192.0.2.117:1234/v1   # placeholder; put the real address in agents/bench.local.yaml
  default: qwen/qwen3.6-35b-a3b
  context_length: 65536
telegram:
  enabled: false
  allowed_users: []
consolidation:
  enabled: true
  schedule: "30 2 * * *"        # in the agent's timezone; before the 03:00 fresh session

session_reset:                  # start a fresh conversation on the first message after this hour
  mode: daily
  at_hour: 3                    # in the agent's timezone
