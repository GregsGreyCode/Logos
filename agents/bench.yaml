# Throwaway agent used by the evals (scripts/logos-eval); evals/agent_writes/bench.py rewrites
# model.default when comparing models.
name: bench
dashboard: false                # benchmark runs only; not shown in the web dashboard
display_name: Benchmark agent
image: logos-agent:0.23.1
soul: souls/general/soul.md
policy: infra/agent-image/policy.yaml
providers: []
timezone: Europe/London
noticeboard: true               # only so the evals can test the noticeboard rules
voice: true                     # voice notes are turned into text by the voice service (docs/voice.md)
role: test                      # test agents and real agents cannot message each other
model:
  provider: lmstudio
  base_url: http://192.0.2.117:1234/v1   # placeholder; put the real address in agents/bench.local.yaml
  default: qwen/qwen3.6-35b-a3b
  context_length: 65536
  gateway: true                 # model calls go through the model gateway (docs/model-gateway.md)
  # No paid fallbacks: the brain stays local (gateway/model_gateway.py BRAIN_STAYS_LOCAL).
budget:
  monthly_usd: 1               # hard cap on paid model spend a month; beyond it only the local model answers
consolidation:
  enabled: true
  schedule: "30 2 * * *"        # in the agent's timezone; before the 03:00 fresh session

session_reset:                  # start a fresh conversation on the first message after this hour
  mode: daily
  at_hour: 3                    # in the agent's timezone
