<!doctype html>
<html lang="en" data-theme="dark" data-look="glass" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logos</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#171a21" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- M1: the encryption module the Matrix files load, Logos's own pinned copy (story M0) -->
<script type="importmap">{"imports":{"@matrix-org/matrix-sdk-crypto-wasm":"/ui/vendor/matrix/crypto/index.mjs"}}</script>
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/ui/looks/glass.css">
<link rel="stylesheet" href="/ui/looks/hud.css">
<link rel="stylesheet" href="/ui/looks/warm.css">
<script>
// The look before first paint (L3): this device's memory of it; the one saved with the login follows.
try {
  var d = document.documentElement, look = localStorage.getItem('logos-look') || 'glass';
  var mode = localStorage.getItem('logos-mode') || localStorage.getItem('logos-theme') || 'dark';
  if (['glass', 'hud', 'warm'].indexOf(look) < 0) look = 'glass';
  if (look === 'hud') mode = 'dark';
  d.dataset.look = look; d.dataset.mode = mode;
  d.dataset.theme = mode === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : mode;
} catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <!-- Phone: one-line top bar. The desktop shows the side menu instead. -->
  <header class="topbar">
    <a class="logo-link" href="#/home" title="Logos · Home"><img class="logo" src="/static/logo.svg" alt="Logos"></a>
    <span class="topbar-sep" aria-hidden="true"></span>
    <span class="screen-name" id="screen-name"></span>
    <button type="button" class="avatar-btn" id="acct-btn" aria-label="Your account" aria-haspopup="dialog"
      aria-controls="acct-sheet" aria-expanded="false"><span class="avatar" id="avatar"></span></button>
  </header>

  <nav class="nav" aria-label="Main">
    <div class="brand-row"><a class="logo-link" href="#/home" title="Logos · Home"><img class="logo" src="/static/logo.svg" alt="Logos"></a></div>
    <div class="nav-links">
      <a href="#/home" data-view="home" data-icon="home"><span class="nav-label">Home</span></a>
      <!-- The same names as the phone (Greg, 23 Nov): Agents is the agents and their chats; Routines what
           they do on their own. What only whoever manages Logos uses sits under Manage. -->
      <a href="#/chat" data-view="chat" data-icon="agents"><span class="nav-label">Agents</span></a>
      <a href="#/noticeboard" data-view="noticeboard" data-icon="bell"><span class="nav-label">Notifications</span><span class="badge nb-badge" hidden></span></a>
      <a href="#/brain" data-view="brain" data-icon="doc"><span class="nav-label">Brain</span></a>
      <a href="#/agents" data-view="agents" data-icon="clock"><span class="nav-label">Routines</span></a>
      <a href="#/settings" data-view="settings" data-icon="gear"><span class="nav-label">Settings</span></a>
      <span class="nav-group admin-only" hidden>Manage</span>
      <a class="admin-only" hidden href="#/people" data-view="people" data-icon="people"><span class="nav-label">People</span></a>
      <a class="admin-only" hidden href="#/models" data-view="models" data-icon="chip"><span class="nav-label">Models</span></a>
      <a class="admin-only" hidden href="#/advisor" data-view="advisor" data-icon="shield"><span class="nav-label">Claude Advisor</span></a>
    </div>
    <div class="nav-foot">
      <span class="who"></span>
      <button type="button" class="linkish logout-btn">Sign out</button>
    </div>
  </nav>

  <main class="main" id="view"></main>

  <!-- Phone (21 Nov): Home, your Agents (tap one for its Chat, Brain and About), and Notifications. The rest is
       in your account panel (the initial, top right). -->
  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8H4z"/><path d="M10 19v-5h4v5"/></svg>Home</a>
    <a href="#/chat" data-view="chat" data-also="brain agents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Agents</a>
    <a href="#/noticeboard" data-view="noticeboard">
      <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="tab-badge nb-badge" hidden></span></span>Notifications</a>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="acct-sheet" role="dialog" aria-modal="true" aria-label="Your account" hidden>
    <span class="sheet-grip" aria-hidden="true"></span>
    <div class="sheet-who"><span class="avatar big"></span><span><span class="who strong"></span><br><span class="when role"></span></span></div>
    <!-- What was under More (Greg, 21 Nov), before Settings. -->
    <a hidden class="sheet-row admin-only" href="#/advisor" data-view="advisor" data-icon="shield">Claude Advisor</a>
    <a hidden class="sheet-row admin-only" href="#/models" data-view="models" data-icon="chip">Models</a>
    <a hidden class="sheet-row admin-only" href="#/people" data-view="people" data-icon="people">People</a>
    <a class="sheet-row" href="#/settings" data-view="settings" data-icon="gear">Settings</a>
    <button type="button" class="sheet-row logout-btn danger-text" data-icon="logout">Sign out</button>
  </div>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
