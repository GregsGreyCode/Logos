<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logos</title>
<link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/app.css">
<script>
// Theme before first paint. Dark unless this browser was switched to light.
try { if (localStorage.getItem('logos-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Main">
    <div class="brand">Logos</div>
    <div class="nav-links">
      <a href="#/chat" data-view="chat">Chat</a>
      <a href="#/brain" data-view="brain">Brain</a>
      <a href="#/noticeboard" data-view="noticeboard">Noticeboard <span class="badge" id="nb-badge" hidden></span></a>
      <a href="#/agents" data-view="agents">Agents</a>
      <a href="#/models" data-view="models">Models</a>
      <a href="#/people" data-view="people">People</a>
    </div>
    <div class="nav-foot">
      <span id="who"></span>
      <button type="button" class="linkish" id="theme"></button>
      <a href="/classic">Old dashboard</a>
      <button type="button" class="linkish" id="logout">Sign out</button>
    </div>
  </nav>
  <main class="main" id="view"></main>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
