<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logos Setup</title>
  <meta name="theme-color" content="#0d0d0d">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/tailwind.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important}
    html{background:#010409;font-size:clamp(15px,1.2vw,18px)}
    @keyframes page-fadein{from{opacity:0}to{opacity:1}}
    @keyframes page-fadeout{from{opacity:1}to{opacity:0}}
    body{background-color:#010409;background-image:radial-gradient(rgba(99,102,241,0.06) 1px,transparent 1px);background-size:28px 28px;overflow-x:hidden}
    .setup-content{animation:page-fadein 1s ease 0.2s both}
    .setup-fadeout{animation:page-fadeout 0.45s ease forwards!important}
    /* All colour cycling driven by --hue-deg from the rAF wall-clock loop */
    @keyframes orb-fadein{to{opacity:0.033}}
    @keyframes halo-fadein{to{opacity:0.14}}
    body::before{
      content:'';position:fixed;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:2400px;height:2400px;border-radius:50%;
      /* Pre-blurred radial gradient — simulates blur(280px) at zero GPU cost */
      background:radial-gradient(circle,
        hsl(var(--accent-hue,239),84%,64%) 0%,
        hsla(var(--accent-hue,239),84%,64%,0.7) 15%,
        hsla(var(--accent-hue,239),84%,50%,0.3) 35%,
        hsla(var(--accent-hue,239),84%,30%,0.05) 55%,
        transparent 70%);
      opacity:0;
      pointer-events:none;z-index:0;
      animation:orb-fadein 0.8s ease 0.1s forwards;
    }
    /* Match login.html's .logo-img filter exactly so the colour stays
       continuous across the /login → /setup transition. */
    .setup-logo{filter:hue-rotate(var(--hue-deg,0deg)) brightness(1.15);will-change:filter;}
    .setup-halo{
      position:absolute;inset:-280px;border-radius:50%;
      /* Pre-blurred radial gradient — simulates blur(160px) without CPU cost */
      background:radial-gradient(circle,
        hsl(var(--accent-hue,239),84%,64%) 0%,
        hsla(var(--accent-hue,239),84%,64%,0.6) 20%,
        hsla(var(--accent-hue,239),84%,50%,0.2) 45%,
        transparent 65%);
      opacity:0;
      pointer-events:none;
      animation:halo-fadein 0.8s ease 0.1s forwards;
    }
    /* Skip fade-in when arriving via login transition — halo and orb are already "on" */
    .setup-halo-instant{animation:none!important;opacity:0.14!important}
    body.setup-instant-orb::before{animation:none!important;opacity:0.033!important}
    /* Bump every Tailwind text utility one step up inside the setup flow */
    .setup-scale .text-\[11px\]{font-size:0.75rem}
    .setup-scale .text-xs{font-size:0.875rem}
    .setup-scale .text-sm{font-size:1rem}
    .setup-scale .text-xl{font-size:1.5rem}
    .btn-primary{
      /* Use hsl() with CSS var instead of filter:hue-rotate — zero CPU cost */
      background:linear-gradient(135deg,
        hsl(calc(var(--accent-hue,239) + 0),84%,64%) 0%,
        hsl(calc(var(--accent-hue,239) + 30),65%,60%) 100%);
      color:#fff;font-weight:500;cursor:pointer;
      box-shadow:0 1px 2px rgba(0,0,0,0.4),0 0 0 1px hsla(calc(var(--accent-hue,239)),84%,64%,0.3) inset;
      transition:opacity 150ms ease,box-shadow 150ms ease;
    }
    .btn-primary:hover:not(:disabled){opacity:0.9;box-shadow:0 1px 2px rgba(0,0,0,0.5),0 0 20px hsla(calc(var(--accent-hue,239)+30),65%,60%,0.2),0 0 0 1px hsla(calc(var(--accent-hue,239)+30),65%,60%,0.35) inset;}
    .btn-primary:active:not(:disabled){opacity:0.95;transform:translateY(1px);}
    .btn-primary:disabled{opacity:0.4;cursor:not-allowed;background:#4f46e5;}
  </style>
  <script>
    // Drive all hue-synced elements from a single rAF loop via --hue-deg.
    // Anchored to wall-clock time — same colour at the same real-world second
    // on every page and after every refresh. 6 deg/s → full 360° in 60s.
    // Throttled to ~15fps — hue cycling doesn't need 60fps.
    (function(){
      let lastTs = 0;
      function tick(now) {
        if (now - lastTs > 66) {
          lastTs = now;
          const deg = ((Date.now() / 1000) * 6 % 360).toFixed(1);
          // The logo SVG has a natural indigo (~239°) base and hue-rotate
          // ROTATES it, so the rendered colour is (239 + --hue-deg) mod 360.
          // --accent-hue is that sum and matches login.html's identical var.
          const accent = ((parseFloat(deg) + 239) % 360).toFixed(1);
          const ds = document.documentElement.style;
          ds.setProperty('--hue-deg', deg + 'deg');
          ds.setProperty('--accent-hue', accent);
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</head>
<body class="min-h-screen text-white">
<div x-data="setup()" x-init="init()" class="setup-scale flex flex-col min-h-screen">

  <header class="flex flex-col items-center pt-10 pb-4 gap-4" style="position:relative;z-index:1">
    <div class="relative inline-block">
      <div class="setup-halo"></div>
      <img src="/static/logo.svg" class="setup-logo relative" style="width:56px;height:56px;object-fit:contain;">
    </div>
  </header>

  <main class="setup-content flex-1 flex items-start justify-center px-4 pt-6 pb-16" style="position:relative;z-index:1">
    <form class="w-full" style="max-width:34rem" @submit.prevent="submit()" data-testid="setup-form">
      <div class="mb-6">
        <h2 class="text-xl font-bold mb-1">Create your account</h2>
        <p class="text-gray-400 text-sm">This is the admin login for this Logos install. You can add one more person now, or later from the dashboard.</p>
      </div>

      <!-- Admin account -->
      <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Admin account</div>
      <div class="space-y-3 mb-6">
        <div>
          <label class="block text-xs text-gray-500 mb-1.5" for="setup-name">Name</label>
          <input id="setup-name" x-model="name" type="text" autocomplete="name" maxlength="100" required
            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:border-indigo-500 focus:outline-none transition-colors"
            style="-webkit-box-shadow:0 0 0 1000px #111827 inset;-webkit-text-fill-color:#f3f4f6;color:#f3f4f6" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1.5" for="setup-email">Email address</label>
          <input id="setup-email" x-model="email" type="email" autocomplete="email" required
            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:border-indigo-500 focus:outline-none transition-colors"
            style="-webkit-box-shadow:0 0 0 1000px #111827 inset;-webkit-text-fill-color:#f3f4f6;color:#f3f4f6" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1.5" for="setup-password">Password</label>
          <input id="setup-password" x-model="password" type="password" autocomplete="new-password" required
            placeholder="At least 8 characters"
            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm placeholder-gray-600 focus:border-indigo-500 focus:outline-none transition-colors" />
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1.5" for="setup-password-confirm">Confirm password</label>
          <input id="setup-password-confirm" x-model="passwordConfirm" type="password" autocomplete="new-password" required
            class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:border-indigo-500 focus:outline-none transition-colors" />
        </div>
        <div x-show="password && password.length < 8" x-cloak
          class="text-xs text-red-400 px-1">Password must be at least 8 characters.</div>
        <div x-show="password.length >= 8 && passwordConfirm && password !== passwordConfirm" x-cloak
          class="text-xs text-red-400 px-1">Passwords do not match.</div>
      </div>

      <!-- Optional second account -->
      <div class="border-t border-gray-800 pt-5 mb-6">
        <div class="flex items-center justify-between mb-3">
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Second account <span class="text-gray-700 normal-case font-normal">(optional)</span></div>
          <button type="button" x-show="!addSecond" @click="addSecond = true"
            class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">+ Add a second person</button>
          <button type="button" x-show="addSecond" x-cloak @click="addSecond = false"
            class="text-xs text-gray-500 hover:text-red-400 transition-colors">Remove</button>
        </div>
        <template x-if="addSecond">
          <div class="rounded-xl border border-gray-800 bg-gray-900/50 p-3 space-y-2">
            <div class="flex gap-2">
              <input x-model="second.name" type="text" placeholder="Name" aria-label="Second account name" maxlength="100"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-indigo-500 focus:outline-none transition-colors" />
              <input x-model="second.email" type="email" placeholder="Email" aria-label="Second account email"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-indigo-500 focus:outline-none transition-colors" />
            </div>
            <input x-model="second.password" type="password" placeholder="Password (at least 8 characters)"
              aria-label="Second account password" autocomplete="new-password"
              :class="second.password && second.password.length < 8 ? 'border-red-600' : 'border-gray-700'"
              class="w-full bg-gray-900 border rounded-lg px-3 py-2 text-sm text-white placeholder-gray-600 focus:border-indigo-500 focus:outline-none transition-colors" />
            <p class="text-[11px] text-gray-600">They sign in with this email and password. Not an admin.</p>
          </div>
        </template>
      </div>

      <div x-show="error" x-cloak class="text-xs text-red-400 px-1 mb-3" role="alert" x-text="error"></div>

      <button type="submit" :disabled="!canSubmit() || submitting"
        class="btn-primary w-full py-2.5 rounded-xl text-sm">
        <span x-show="!submitting">Create account &rarr;</span>
        <span x-show="submitting" x-cloak class="animate-pulse">Creating&hellip;</span>
      </button>
    </form>
  </main>

  <div class="text-center text-[11px] text-gray-600 pb-4" style="position:relative;z-index:1">
    __VERSION_LABEL__
  </div>
</div>

<script>
function setup() {
  return {
    name: '', email: '', password: '', passwordConfirm: '',
    addSecond: false,
    second: { name: '', email: '', password: '' },
    submitting: false,
    error: '',

    init() {
      // Arriving via the login → setup transition: the logo is already lit,
      // so skip the halo/orb bloom-in.
      try {
        if (sessionStorage.getItem('logos_fl')) {
          document.querySelector('.setup-halo')?.classList.add('setup-halo-instant');
          document.body.classList.add('setup-instant-orb');
        }
      } catch {}
      // Leftovers from the v1 wizard.
      try {
        ['logos_setup_scan', 'logos_setup_progress', 'logos_setup_progress_v2']
          .forEach(k => localStorage.removeItem(k));
      } catch {}
    },

    secondFilled() {
      const s = this.second;
      return this.addSecond && !!(s.name.trim() || s.email.trim() || s.password);
    },

    canSubmit() {
      if (!this.name.trim() || !this.email.trim()) return false;
      if (this.password.length < 8 || this.password !== this.passwordConfirm) return false;
      if (this.secondFilled()) {
        const s = this.second;
        if (!s.name.trim() || !s.email.trim() || s.password.length < 8) return false;
      }
      return true;
    },

    async submit() {
      if (!this.canSubmit() || this.submitting) return;
      this.submitting = true;
      this.error = '';
      const body = { name: this.name.trim(), email: this.email.trim(), password: this.password };
      if (this.secondFilled()) {
        body.second = {
          name: this.second.name.trim(),
          email: this.second.email.trim(),
          password: this.second.password,
        };
      }
      try {
        const r = await fetch('/api/setup/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(body),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (d.error === 'setup_already_completed') { window.location.href = '/login'; return; }
          this.error = d.detail || d.error || ('Setup failed (HTTP ' + r.status + ').');
          this.submitting = false;
          return;
        }
        try { sessionStorage.setItem('logos_fl', '1'); } catch {}
        document.querySelector('.setup-content')?.classList.add('setup-fadeout');
        document.querySelector('header')?.classList.add('setup-fadeout');
        await new Promise(res => setTimeout(res, 460));
        window.location.href = '/';
      } catch (e) {
        this.error = 'Could not reach the gateway: ' + e;
        this.submitting = false;
      }
    },
  };
}
</script>
</body>
</html>
