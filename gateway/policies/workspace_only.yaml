# OpenShell policy preset: WORKSPACE ONLY
#
# Default sandbox policy — allows writes only to the workspace and tmp.
# Agent binaries, Python, and Node can reach configured model endpoints.
# curl/wget are restricted from arbitrary outbound access.
#
# Maps to: FilesystemPolicy.WORKSPACE_ONLY + NetworkPolicy.ALLOWLISTED

version: "1"

filesystem:
  read_write:
    - /sandbox
    - /tmp
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /home
    - /hermes/SOUL.md

process:
  run_as_user: hermes

network:
  # Model inference endpoints (local servers)
  - action: allow
    destination: "host.docker.internal"
    ports: [11434, 1234, 8000, 8080, 8081]
    methods: [GET, POST]

  - action: allow
    destination: "127.0.0.1"
    ports: [11434, 1234, 8000]
    methods: [GET, POST]

  # OpenShell Privacy Router (inference.local)
  - action: allow
    destination: "inference.local"
    ports: [443]
    methods: [GET, POST]

  # DNS resolution
  - action: allow
    destination: "*"
    ports: [53]
    protocol: udp

  # Default deny — no package registries, no GitHub, no arbitrary outbound
  - action: deny
    destination: "*"
