# Browserless access preset — self-hosted browser automation.
#
# Enables the browser_* tools to connect to a self-hosted Browserless
# (https://github.com/browserless/browserless) container running in your
# homelab. Unlike the Browserbase preset, no traffic leaves your network.
#
# Apply via:
#   gateway.policies.apply_preset(agent_id, "browserless")
#
# Requires BROWSERLESS_URL (and optionally BROWSERLESS_TOKEN). Edit the
# `host` line below to match your Browserless deployment hostname.
# Defaults assume `browserless.internal` is reachable from sandboxes
# (consistent with the openshell *.internal:53 DNS allowance).

preset:
  name: browserless
  description: "Self-hosted Browserless CDP endpoint"

network_policies:
  browserless:
    name: browserless
    endpoints:
      # CDP WebSocket endpoint. Targets host.openshell.internal — the
      # hostname OpenShell injects into sandbox DNS resolving to the
      # docker bridge gateway (172.17.0.1). The host's docker-compose
      # `logos-browserless` container binds 0.0.0.0:3000 so the sandbox
      # can reach it through that bridge once this preset is applied.
      # If you front browserless with a different hostname (e.g. a
      # cluster-internal service), edit this and the BROWSERLESS_URL
      # credential together.
      - host: host.openshell.internal
        port: 3000
        enforcement: enforce
        tls: passthrough
        access: full
    binaries:
      - { path: /app/venv/bin/python }
      - { path: /app/venv/bin/python3 }
      - { path: /app/venv/bin/python3.11 }
      - { path: /app/venv/bin/python3.12 }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
