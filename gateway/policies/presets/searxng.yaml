# Self-hosted SearxNG metasearch access preset — local-only search
# that lets an agent run open-ended web search without sending queries
# to a third-party (Firecrawl etc).
#
# SearxNG is a metasearch engine you run yourself. It proxies queries
# to Google / Bing / DuckDuckGo / etc. from ITS host, aggregates the
# results, and returns them via a plain HTTP JSON endpoint. The agent
# sandbox talks only to your local SearxNG — never to the upstream
# search engines directly, so CAPTCHAs never hit the sandbox and no
# query text leaves your network.
#
# Apply via:
#   gateway.policies.apply_preset(agent_id, "searxng")
#
# Paired with the "Search the web locally" capability row in
# capabilities.yaml (trust: local_service).
#
# Set SEARXNG_URL in Config → Tools to point at your instance
# (default: http://searxng.internal:8080). Two ways to hit it:
#
# Cheap path (no Chromium needed) — use ``execute_code`` with stdlib
# urllib, which every agent has:
#   import urllib.request, json
#   r = urllib.request.urlopen(f"{SEARXNG_URL}/search?q={q}&format=json")
#   print(json.dumps(json.loads(r.read()))[:4000])
# Soul guidance in ``souls/_shared/workspace.md`` prefers this when the
# task is a plain JSON fetch — avoids the Playwright install-loop
# agents hit if Chromium binaries aren't baked in (see LOG-56).
#
# Rendered-page path — browser_navigate + browser_console(document.body.innerText)
# is the original recipe and still works when the browser tool is
# usable. Slower but handles JS-driven result pages.
#
# Applying this preset without running SearxNG is harmless — it just
# widens the sandbox egress rules; the agent only knows to use the URL
# when the env var is set (see sandbox_worker browser-recipe injection).

preset:
  name: searxng
  description: "Self-hosted SearxNG metasearch access (local-only web search)"

network_policies:
  searxng:
    name: searxng
    endpoints:
      # host.openshell.internal routes sandbox traffic to the Logos
      # host's published port. docker-compose publishes SearxNG on
      # 8888 by default (change via SEARXNG_PORT in .env).
      #
      # Policy shape mirrors the mcp_gateway entry in
      # openshell_default.yaml — `allowed_ips: 172.0.0.0/8` is
      # required because host.openshell.internal resolves to
      # the docker-compose bridge IP (172.x.x.x), and without
      # that IP range in the allowlist the proxy 403s the
      # connection even when the hostname is matched. `rules:`
      # whitelists the two methods SearxNG's JSON API uses.
      - host: host.openshell.internal
        port: 8888
        protocol: rest
        enforcement: enforce
        allowed_ips:
          - "172.0.0.0/8"
        rules:
          - allow:
              method: GET
              path: /*
          - allow:
              method: POST
              path: /*
    binaries:
      - { path: /app/venv/bin/python }
      - { path: /app/venv/bin/python3 }
      - { path: /app/venv/bin/python3.11 }
      - { path: /app/venv/bin/python3.12 }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/local/share/ms-playwright/chromium-1217/chrome-linux64/chrome }
      - { path: /usr/local/share/ms-playwright/chromium_headless_shell-1217/chrome-headless-shell-linux64/chrome-headless-shell }
