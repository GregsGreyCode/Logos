# Default OpenShell policy for Hermes agent sandboxes.
#
# Applied automatically by OpenShellExecutor at sandbox creation.
# Hot-reloadable: openshell policy set <name> --policy openshell_default.yaml --wait
#
# Plan A architecture (TASKS.md #24): the host gateway drives the sandbox
# via `openshell sandbox exec --no-tty -- python3 /app/sandbox_worker.py`
# over OpenShell's blessed gRPC/mTLS exec transport. The sandbox no longer
# initiates outbound traffic to host.openshell.internal:8091 — that
# reverse-connection model (broken by OpenShell's L7 proxy tightening)
# has been retired along with the `logos_gateway` network_policy entry.
#
# This policy now only allows the sandbox worker to:
#   1. Call the LLM via inference.local (OpenShell's privacy router)
#   2. Resolve DNS for *.internal hostnames

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /home/sandbox
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  inference_local:
    name: "Inference (Privacy Router)"
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        tls: terminate
        access: full
    binaries:
      - path: /app/venv/bin/python3
      - path: /app/venv/bin/python
      - path: /app/venv/bin/python3.12
      - path: /usr/bin/python3
      - path: /usr/bin/curl

  dns:
    name: "DNS resolution"
    endpoints:
      - host: "*.internal"
        port: 53
        access: full
